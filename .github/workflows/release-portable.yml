name: Build portable release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v1.3.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        shell: pwsh
        run: |
          $version = $env:REQUESTED_VERSION
          if ($version -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag" }
          if ((Get-Content VERSION -Raw).Trim() -ne $version.Substring(1)) { throw "VERSION differs from release tag" }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

      - name: Run regression tests
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q tests

      - name: Build Smart App Control friendly portable ZIP
        run: python scripts/build_portable.py --version "$env:RELEASE_VERSION" --output dist

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_VERSION" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_VERSION" --verify-tag --draft --title "$env:RELEASE_VERSION" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          }
          $archive = Get-ChildItem -LiteralPath dist -Filter *.zip | Select-Object -First 1
          if (-not $archive) { throw "Portable archive was not created" }
          gh release upload "$env:RELEASE_VERSION" "$($archive.FullName)" "$(Resolve-Path 'dist/SHA256SUMS.txt')" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
          gh release edit "$env:RELEASE_VERSION" --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
